# GitHub Pages: README.md becomes the site index.
title: vim-c-env
description: >-
  Vim as a C/C++ IDE: clangd LSP via coc.nvim with autocompletion,
  go-to-definition, diagnostics, rename and clang-format. One-command install
  for Linux, macOS and Windows.
url: https://kewl-ua.github.io
baseurl: /vim-c-env
lang: en
image: /assets/social-preview.png
author: kewl-ua
repository: kewl-ua/vim-c-env

# Richer cards for jekyll-seo-tag (Twitter/OpenGraph + JSON-LD sameAs).
twitter:
  card: summary_large_image
social:
  name: vim-c-env
  links:
    - https://github.com/kewl-ua/vim-c-env

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - example
  - install.sh
  - Makefile
  - vimrc
  - coc-settings.json
